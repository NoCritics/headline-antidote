[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "headline-guard"
version = "0.1.0"
description = "Checks that the news headline an LLM reads is the text a human reader sees: homoglyphs, hidden HTML text, invisible characters."
readme = "README.md"
requires-python = ">=3.11"
# The parsers and the CSS cascade are pinned to the versions the tests were run against: a new
# lexbor or cascade release can change what counts as visible. selectolax 1.0.2 carries the
# patched lexbor; cssselect2 0.10.1 fixes CVE-2026-55073.
dependencies = [
    "lxml>=6.1.3",
    "selectolax==1.0.2",
    "tinycss2==1.5.1",
    "cssselect2==0.10.1",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
# The browser check drives the installed Google Chrome (channel="chrome"); no browser is downloaded.
browser = ["playwright>=1.64.1"]

[tool.setuptools]
packages = ["headline_guard"]

[tool.setuptools.package-data]
headline_guard = ["unicode_data/*.txt", "unicode_data/manifest.json"]
